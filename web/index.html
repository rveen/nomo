<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Nomo</h1>
  <nav aria-label="Worksheet">
    <button type="button" id="new">New</button>
    <button type="button" id="open">Open</button>
    <button type="button" id="save">Save</button>
    <button type="button" id="save-as">Save as</button>
  </nav>
  <!--
    Buttons do things; checkboxes say how the results are shown. Typeset and
    Pages are both the latter, so they are the same kind of control, side by
    side. Print is an action, and stays a button.
  -->
  <div id="view" role="group" aria-label="View">
    <label title="Draw the mathematics as formulas">
      <input type="checkbox" id="typeset"> Typeset
    </label>
    <label title="Show the worksheet as the pages it prints on">
      <input type="checkbox" id="pages"> Pages
    </label>
  </div>
  <nav aria-label="Print">
    <button type="button" id="print"
            title="Print the worksheet as pages (Ctrl+P)">Print</button>
  </nav>
  <p id="file-name">untitled.nomo</p>
  <p id="status">loading…</p>
</header>

<!--
  The import report. Hidden until there is one, and dismissible, because it is
  about an event rather than about the document: it describes what a translation
  did, and once it has been read it should stop taking space from the worksheet.
-->
<section id="import" hidden aria-label="Import report">
  <p id="import-summary"></p>
  <ul id="import-list"></ul>
  <button type="button" id="import-dismiss">Dismiss</button>
</section>

<main>
  <section id="pane-editor" aria-label="Worksheet source">
    <div id="editor"></div>
  </section>
  <section id="pane-output" aria-label="Results">
    <div id="output"></div>
    <!--
      The Pages view: the paged document `nomo html --paged` writes, laid out
      by Folio in a frame of its own. A frame because Folio installs @page
      rules and a print stylesheet for the whole document it runs in, which in
      this one would collide with the editor's; and because a frame prints
      itself, so Print gives exactly the pages on screen.
    -->
    <iframe id="pages-frame" title="The worksheet as printed pages" hidden></iframe>
  </section>
</main>

<footer>
  <p>
    Everything runs in this tab. The engine is WebAssembly, nothing is sent
    anywhere, your work is kept in this browser, and it all works offline.
  </p>
  <p>
    <a href="language/">The language</a>
    <a href="examples/">Worked examples</a>
  </p>
</footer>

<script type="module" src="bundle.js"></script>
</body>
</html>
